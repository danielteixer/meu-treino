<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
"use strict";
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef, useCallback = React.useCallback;

var INK = "#14151A", PAPER = "#F4F4F6", LINE = "#E4E5EA", MUTED = "#8A8D98";

var DEFAULT_DAYS = [
  { key:"DIA1", n:"1", title:"PUSH", subtitle:"Peito, Ombro e Tríceps", color:"#FF4B3E", exercises:[
    {id:"supino-reto", name:"Supino reto (barra ou halteres)", reps:"4x8-10", main:true},
    {id:"supino-inclinado-halteres", name:"Supino inclinado com halteres", reps:"3x10-12", main:false},
    {id:"desenvolvimento-ombro", name:"Desenvolvimento de ombro (halteres)", reps:"3x10-12", main:true},
    {id:"elevacao-lateral-push", name:"Elevação lateral", reps:"3x12-15", main:false},
    {id:"crucifixo-peck-deck", name:"Crucifixo ou peck deck", reps:"3x12-15", main:false},
    {id:"triceps-corda", name:"Tríceps corda (polia)", reps:"3x12-15", main:false},
    {id:"triceps-frances", name:"Tríceps francês", reps:"3x10-12", main:false},
  ]},
  { key:"DIA2", n:"2", title:"PULL", subtitle:"Costas e Bíceps", color:"#3E8EFF", exercises:[
    {id:"barra-fixa", name:"Barra fixa (ou puxada frontal)", reps:"4x8-10", main:true},
    {id:"remada-curvada", name:"Remada curvada (barra)", reps:"4x8-10", main:true},
    {id:"remada-baixa", name:"Remada baixa (polia)", reps:"3x10-12", main:false},
    {id:"puxada-aberta", name:"Puxada aberta (pulldown)", reps:"3x10-12", main:false},
    {id:"rosca-direta", name:"Rosca direta (barra)", reps:"3x10-12", main:false},
    {id:"rosca-martelo", name:"Rosca martelo", reps:"3x10-12", main:false},
  ]},
  { key:"DIA3", n:"3", title:"LEGS", subtitle:"Pernas Completo", color:"#3ECF8E", exercises:[
    {id:"agachamento-livre", name:"Agachamento livre", reps:"4x8-10", main:true},
    {id:"leg-press", name:"Leg press", reps:"4x10-12", main:true},
    {id:"cadeira-extensora", name:"Cadeira extensora", reps:"3x12-15", main:false},
    {id:"mesa-flexora", name:"Mesa flexora", reps:"3x12-15", main:false},
    {id:"panturrilha-em-pe", name:"Panturrilha em pé", reps:"4x15-20", main:false},
  ]},
  { key:"DIA4", n:"4", title:"UPPER", subtitle:"Superior Geral", color:"#B15EFF", exercises:[
    {id:"supino-inclinado-barra", name:"Supino inclinado (barra)", reps:"4x8-10", main:true},
    {id:"remada-unilateral", name:"Remada unilateral (halter)", reps:"4x8-10", main:true},
    {id:"desenvolvimento-militar", name:"Desenvolvimento militar (barra)", reps:"3x8-10", main:true},
    {id:"elevacao-lateral-upper", name:"Elevação lateral", reps:"3x12-15", main:false},
    {id:"rosca-alternada", name:"Rosca alternada", reps:"3x10-12", main:false},
    {id:"triceps-testa", name:"Tríceps testa", reps:"3x10-12", main:false},
  ]},
  { key:"DIA5", n:"5", title:"LOWER", subtitle:"Inferior + Posterior", color:"#FFB13E", exercises:[
    {id:"terra-romeno", name:"Levantamento terra romeno (RDL)", reps:"4x8-10", main:true},
    {id:"agachamento-bulgaro", name:"Agachamento búlgaro", reps:"3x10-12 / perna", main:true},
    {id:"cadeira-flexora", name:"Cadeira flexora", reps:"3x12-15", main:false},
    {id:"hip-thrust", name:"Hip thrust", reps:"3x10-12", main:false},
    {id:"panturrilha-sentado", name:"Panturrilha sentado", reps:"4x15-20", main:false},
    {id:"abdomen-prancha", name:"Abdômen (prancha + pernas)", reps:"3x séries", main:false},
  ]},
];

var DAYS_KEY = "cargas-treino-dias-v1";
var DAY_COLOR_PALETTE = ["#FF4B3E","#3E8EFF","#3ECF8E","#B15EFF","#FFB13E","#FF6FA8","#2FB8C4","#8D8FA0"];

function loadDaysList(){
  try {
    var raw = localStorage.getItem(DAYS_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DAYS));
}

var DATA_KEY = "cargas-dados-v2";
var OLD_DATA_KEY = "hipertrofia-pesos-v1";

function todayLabel(){
  var d = new Date();
  return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric"});
}
function hexToRgba(hex, alpha){
  var hx = hex.replace("#","");
  var r=parseInt(hx.substring(0,2),16), g=parseInt(hx.substring(2,4),16), b=parseInt(hx.substring(4,6),16);
  return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
}

// Migra dados antigos (chave = índice do exercício) para o formato novo (chave = id estável),
// caso o usuário já tivesse histórico salvo antes dessa atualização.
function loadInitialData(){
  try {
    var raw = localStorage.getItem(DATA_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  try {
    var old = localStorage.getItem(OLD_DATA_KEY);
    if (old) {
      var oldData = JSON.parse(old);
      var migrated = {};
      DAYS.forEach(function(day){
        var oldDay = oldData[day.key];
        if (!oldDay) return;
        var newDay = {};
        day.exercises.forEach(function(ex, idx){
          var cell = oldDay[idx];
          if (cell) newDay[ex.id] = cell;
        });
        migrated[day.key] = newDay;
      });
      return migrated;
    }
  } catch(e) {}
  return {};
}

function Sparkline(props){
  var history = props.history || [];
  if (history.length < 2) {
    return h("span", {style:{fontSize:10.5, color:MUTED}}, "sem histórico suficiente");
  }
  var vals = history.slice().reverse().map(function(x){ return parseFloat(x.value) || 0; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  var w = 64, hgt = 22, pad = 3;
  var pts = vals.map(function(v, i){
    var x = pad + (i * (w - pad*2) / (vals.length - 1));
    var y = hgt - pad - ((v - min) / range) * (hgt - pad*2);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  var delta = vals[vals.length-1] - vals[0];
  var color = delta > 0 ? "#2E9E5B" : (delta < 0 ? "#D64545" : MUTED);
  return h("div", {style:{display:"flex", alignItems:"center", gap:6}},
    h("svg", {width:w, height:hgt, viewBox:"0 0 " + w + " " + hgt},
      h("polyline", {points:pts, fill:"none", stroke:props.color || INK, strokeWidth:1.6, strokeLinecap:"round", strokeLinejoin:"round"})
    ),
    h("span", {style:{fontSize:10.5, fontWeight:700, color:color}},
      (delta > 0 ? "+" : "") + delta.toFixed(1) + " kg"
    )
  );
}

function CargaTracker(){
  var activeDayState = useState("DIA1"); var activeDay = activeDayState[0], setActiveDay = activeDayState[1];
  var dataState = useState(loadInitialData); var data = dataState[0], setData = dataState[1];
  var saveStateState = useState("idle"); var saveState = saveStateState[0], setSaveState = saveStateState[1];
  var openHistoryState = useState(null); var openHistory = openHistoryState[0], setOpenHistory = openHistoryState[1];
  var showSummaryState = useState(false); var showSummary = showSummaryState[0], setShowSummary = showSummaryState[1];
  var daysListState = useState(loadDaysList); var daysList = daysListState[0], setDaysList = daysListState[1];
  var editModeState = useState(false); var editMode = editModeState[0], setEditMode = editModeState[1];
  var draggingIndexState = useState(null); var draggingIndex = draggingIndexState[0], setDraggingIndex = draggingIndexState[1];
  var pendingConfirmState = useState(null); var pendingConfirm = pendingConfirmState[0], setPendingConfirm = pendingConfirmState[1];
  var toastState = useState(null); var toastMsg = toastState[0], setToastMsg = toastState[1];
  var dragIndexRef = useRef(null);
  var saveTimer = useRef(null);
  var dataRef = useRef(data);

  useEffect(function(){ dataRef.current = data; }, [data]);

  var persist = useCallback(function(next){
    setSaveState("saving");
    try {
      localStorage.setItem(DATA_KEY, JSON.stringify(next));
      setSaveState("saved");
      setTimeout(function(){ setSaveState(function(s){ return s === "saved" ? "idle" : s; }); }, 1600);
    } catch(e) { setSaveState("idle"); }
  }, []);

  var scheduleSave = useCallback(function(next){
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(function(){ persist(dataRef.current); }, 450);
  }, [persist]);

  useEffect(function(){
    function flush(){ if (saveTimer.current) { clearTimeout(saveTimer.current); persist(dataRef.current); } }
    window.addEventListener("pagehide", flush);
    window.addEventListener("visibilitychange", flush);
    return function(){
      window.removeEventListener("pagehide", flush);
      window.removeEventListener("visibilitychange", flush);
      flush();
    };
  }, []);

  useEffect(function(){
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function(){
        navigator.serviceWorker.register("sw.js").catch(function(){});
      });
    }
  }, []);

  useEffect(function(){
    if (!toastMsg) return;
    var t = setTimeout(function(){ setToastMsg(null); }, 2600);
    return function(){ clearTimeout(t); };
  }, [toastMsg]);

  var handleChange = function(dayKey, exId, value){
    setData(function(prev){
      var dayData = Object.assign({}, prev[dayKey] || {});
      var cell = dayData[exId] || {value:"", history:[]};
      dayData[exId] = Object.assign({}, cell, {value:value});
      var next = Object.assign({}, prev); next[dayKey] = dayData;
      scheduleSave(next);
      return next;
    });
  };

  var commitEntry = function(dayKey, exId){
    setData(function(prev){
      var dayData = Object.assign({}, prev[dayKey] || {});
      var cell = dayData[exId] || {value:"", history:[]};
      if (cell.value === "" || cell.value === undefined) return prev;
      var history = Array.isArray(cell.history) ? cell.history.slice() : [];
      var today = todayLabel();
      var filtered = history.filter(function(hst){ return hst.date !== today; });
      filtered.unshift({date: today, value: cell.value});
      dayData[exId] = Object.assign({}, cell, {history: filtered.slice(0,5), updatedAt: today});
      var next = Object.assign({}, prev); next[dayKey] = dayData;
      scheduleSave(next);
      return next;
    });
  };

  var saveDaysList = function(next){
    setDaysList(next);
    try { localStorage.setItem(DAYS_KEY, JSON.stringify(next)); } catch(e) {}
  };

  var updateDayField = function(dayKey, field, value){
    var next = daysList.map(function(d){
      if (d.key !== dayKey) return d;
      var nd = Object.assign({}, d); nd[field] = value; return nd;
    });
    saveDaysList(next);
  };

  var updateExerciseField = function(dayKey, exId, field, value){
    var next = daysList.map(function(d){
      if (d.key !== dayKey) return d;
      var nd = Object.assign({}, d);
      nd.exercises = d.exercises.map(function(ex){
        if (ex.id !== exId) return ex;
        var nex = Object.assign({}, ex); nex[field] = value; return nex;
      });
      return nd;
    });
    saveDaysList(next);
  };

  var toggleMainExercise = function(dayKey, exId, currentMain){
    updateExerciseField(dayKey, exId, "main", !currentMain);
  };

  var renameExercise = function(dayKey, exId, newName){
    updateExerciseField(dayKey, exId, "name", newName);
  };

  var updateExerciseReps = function(dayKey, exId, newReps){
    updateExerciseField(dayKey, exId, "reps", newReps);
  };

  var addExercise = function(dayKey){
    var newId = "ex-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    var next = daysList.map(function(d){
      if (d.key !== dayKey) return d;
      var nd = Object.assign({}, d);
      nd.exercises = d.exercises.concat([{id:newId, name:"Novo exercício", reps:"3x10", main:false}]);
      return nd;
    });
    saveDaysList(next);
  };

  var deleteExercise = function(dayKey, exId){
    setPendingConfirm({
      message: "Remover este exercício da lista?",
      danger: true,
      onConfirm: function(){
        var next = daysList.map(function(d){
          if (d.key !== dayKey) return d;
          var nd = Object.assign({}, d);
          nd.exercises = d.exercises.filter(function(ex){ return ex.id !== exId; });
          return nd;
        });
        saveDaysList(next);
      }
    });
  };

  var MAX_DAYS = 7;

  var addDay = function(){
    if (daysList.length >= MAX_DAYS) { setToastMsg("Você pode ter no máximo " + MAX_DAYS + " dias de treino."); return; }
    var color = DAY_COLOR_PALETTE[daysList.length % DAY_COLOR_PALETTE.length];
    var newKey = "DIA_" + Date.now().toString(36);
    var newDay = { key:newKey, title:"NOVO DIA", subtitle:"Toque para editar", color:color, exercises:[] };
    var next = daysList.concat([newDay]);
    saveDaysList(next);
    setActiveDay(newKey);
    setShowSummary(false);
    setEditMode(true);
  };

  var deleteDay = function(dayKey){
    if (daysList.length <= 1) { setToastMsg("Você precisa manter pelo menos um dia de treino."); return; }
    var dayToDelete = daysList.filter(function(d){ return d.key === dayKey; })[0];
    setPendingConfirm({
      message: "Excluir \"" + (dayToDelete ? dayToDelete.title : "este dia") + "\"? Os pesos registrados nele deixarão de aparecer.",
      danger: true,
      onConfirm: function(){
        var next = daysList.filter(function(d){ return d.key !== dayKey; });
        saveDaysList(next);
        if (activeDay === dayKey) setActiveDay(next[0].key);
      }
    });
  };

  var handleDayPointerDown = function(e, index){
    if (!editMode) return;
    dragIndexRef.current = index;
    setDraggingIndex(index);
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
  };

  var handleDayPointerMove = function(e){
    if (dragIndexRef.current === null) return;
    e.preventDefault();
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var bubbleEl = el && el.closest ? el.closest("[data-day-index]") : null;
    if (!bubbleEl) return;
    var overIndex = parseInt(bubbleEl.getAttribute("data-day-index"), 10);
    if (isNaN(overIndex) || overIndex === dragIndexRef.current) return;
    var fromIndex = dragIndexRef.current;
    setDaysList(function(prev){
      if (fromIndex >= prev.length) return prev;
      var next = prev.slice();
      var moved = next.splice(fromIndex, 1)[0];
      next.splice(overIndex, 0, moved);
      try { localStorage.setItem(DAYS_KEY, JSON.stringify(next)); } catch(err) {}
      return next;
    });
    dragIndexRef.current = overIndex;
    setDraggingIndex(overIndex);
  };

  var handleDayPointerUp = function(){
    dragIndexRef.current = null;
    setDraggingIndex(null);
  };

  var handleReset = function(){
    setPendingConfirm({
      message: "Apagar todos os pesos e históricos salvos neste aparelho? Essa ação não pode ser desfeita.",
      danger: true,
      onConfirm: function(){
        setData({});
        try { localStorage.removeItem(DATA_KEY); } catch(e) {}
        setSaveState("idle");
      }
    });
  };

  var currentDay = daysList.filter(function(d){ return d.key === activeDay; })[0] || daysList[0];
  var currentDayIndex = daysList.indexOf(currentDay);

  var daysRow = h("div", {style:{background:INK, paddingTop:"calc(22px + env(safe-area-inset-top))", paddingLeft:20, paddingRight:20, paddingBottom:0}},
    h("div", {style:{display:"flex", alignItems:"center", gap:10, marginBottom:18}},
      h("img", {src:"icon-180.png", alt:"", style:{width:28, height:28, borderRadius:8, flexShrink:0}}),
      h("span", {style:{color:"#fff", fontWeight:800, fontSize:15, letterSpacing:"0.14em"}}, "TREINO")
    ),
    h("div", {style:{display:"flex", gap:14, overflowX: editMode?"visible":"auto", overflowY:"visible", padding:"6px 4px 20px"}},
      daysList.map(function(d, i){
        var active = d.key === activeDay;
        var isDragging = draggingIndex === i;
        return h("div", {
            key: d.key,
            "data-day-index": i,
            onPointerDown: function(e){ handleDayPointerDown(e, i); },
            onPointerMove: handleDayPointerMove,
            onPointerUp: handleDayPointerUp,
            onPointerCancel: handleDayPointerUp,
            style:{position:"relative", flex:"0 0 auto", display:"flex", flexDirection:"column", alignItems:"center", gap:3,
              touchAction: editMode?"none":"auto", opacity: isDragging?0.5:1,
              transition: isDragging?"none":"opacity .15s"}
          },
          h("button", {
              onClick: function(){ setActiveDay(d.key); setOpenHistory(null); },
              style:{display:"flex", flexDirection:"column", alignItems:"center", gap:6,
                background:"none", border:"none", cursor: editMode?"grab":"pointer", padding:0,
                opacity: active?1:0.55, transform: active?"translateY(-2px)":"none", transition:"all .18s ease"}
            },
            h("div", {style:{width:46, height:46, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center",
                fontWeight:800, fontSize:17, color: active?INK:"#fff",
                background: active?d.color:"transparent", border:"2.5px solid " + d.color,
                boxShadow: active?("0 0 0 4px " + hexToRgba(d.color,0.18)):"none"}
              }, "D" + (i+1)),
            h("span", {style:{fontSize:9.5, fontWeight:700, letterSpacing:"0.06em", color: active?d.color:"#6E7080", maxWidth:56, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}, d.title)
          ),
          editMode ? h("button", {
              onClick: function(){ deleteDay(d.key); },
              onPointerDown: function(e){ e.stopPropagation(); },
              "aria-label": "Excluir " + d.title,
              style:{background:"none", border:"none", color:"#D64545", fontSize:9.5, fontWeight:700,
                cursor:"pointer", padding:"2px 4px"}
            }, "✕ excluir") : null
        );
      }).concat(
        daysList.length < MAX_DAYS ? [
          h("button", {
              key:"add-day",
              onClick: addDay,
              "aria-label":"Adicionar dia de treino",
              style:{flex:"0 0 auto", display:"flex", flexDirection:"column", alignItems:"center", gap:6,
                background:"none", border:"none", cursor:"pointer", padding:0, opacity:0.7}
            },
            h("div", {style:{width:46, height:46, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center",
                fontWeight:800, fontSize:20, color:"#8D8FA0", border:"2.5px dashed #4A4C55"}
              }, "+"),
            h("span", {style:{fontSize:9.5, fontWeight:700, letterSpacing:"0.06em", color:"#6E7080"}}, "NOVO")
          )
        ] : []
      )
    )
  );

  var banner = h("div", {style:{background:currentDay.color, padding:"14px 20px"}},
    h("div", {style:{display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:10}},
      editMode
        ? h("div", {style:{flex:1, minWidth:0}},
            h("div", {style:{color:"rgba(0,0,0,0.55)", fontSize:11, fontWeight:700, letterSpacing:"0.08em", marginBottom:4}}, "DIA " + (currentDayIndex+1)),
            h("input", {
              value: currentDay.title, "aria-label":"Nome do treino do dia",
              onChange: function(e){ updateDayField(currentDay.key, "title", e.target.value.toUpperCase()); },
              style:{display:"block", width:"100%", background:"rgba(255,255,255,0.5)", border:"1px solid rgba(0,0,0,0.2)",
                borderRadius:6, color:INK, fontSize:18, fontWeight:800, padding:"5px 8px", marginBottom:6}
            }),
            h("input", {
              value: currentDay.subtitle, "aria-label":"Subtítulo do treino do dia",
              onChange: function(e){ updateDayField(currentDay.key, "subtitle", e.target.value); },
              style:{display:"block", width:"100%", background:"rgba(255,255,255,0.5)", border:"1px solid rgba(0,0,0,0.2)",
                borderRadius:6, color:INK, fontSize:12.5, fontWeight:500, padding:"5px 8px", marginBottom:8}
            }),
            h("div", {style:{display:"flex", gap:6, flexWrap:"wrap"}},
              DAY_COLOR_PALETTE.map(function(c){
                return h("button", {
                    key:c, onClick: function(){ updateDayField(currentDay.key, "color", c); },
                    "aria-label":"Cor " + c,
                    style:{width:22, height:22, borderRadius:"50%", background:c, cursor:"pointer",
                      border: c===currentDay.color ? "2.5px solid " + INK : "2.5px solid rgba(0,0,0,0.15)"}
                  });
              })
            )
          )
        : h("div", null,
            h("div", {style:{color:"rgba(0,0,0,0.55)", fontSize:11, fontWeight:700, letterSpacing:"0.08em"}}, "DIA " + (currentDayIndex+1)),
            h("div", {style:{color:INK, fontSize:20, fontWeight:800, letterSpacing:"-0.01em"}},
              currentDay.title, currentDay.subtitle ? " " : null, currentDay.subtitle ? h("span", {style:{fontWeight:500}}, "— " + currentDay.subtitle) : null
            )
          ),
      h("button", {
          onClick: function(){ setShowSummary(!showSummary); },
          style:{flexShrink:0, background:"rgba(0,0,0,0.14)", border:"none", borderRadius:16, color:INK, fontWeight:700,
            fontSize:11, padding:"7px 12px", cursor:"pointer"}
        }, showSummary ? "Registrar" : "Resumo")
    )
  );

  var toolbar = h("div", {style:{display:"flex", gap:8, padding:"12px 14px 0"}},
    h("button", {
        onClick: function(){ setEditMode(!editMode); },
        style: Object.assign({}, toolbarBtnStyle, editMode ? {background:currentDay.color, color:INK, borderColor:currentDay.color} : {})
      }, editMode ? "✓ Concluir edição" : "✎ Editar treino"),
    h("button", {onClick:handleReset, style:Object.assign({}, toolbarBtnStyle, {color:"#D64545", borderColor:"#F2C6C6"})}, "Apagar tudo")
  );

  var list;
  if (showSummary) {
    list = h("div", {style:{display:"flex", flexDirection:"column", gap:10}},
      currentDay.exercises.map(function(ex){
        var cell = (data[currentDay.key]||{})[ex.id] || {value:"", history:[]};
        return h("div", {key:ex.id, style:{background:"#fff", borderRadius:10, border:"1px solid " + LINE, padding:"12px"}},
          h("div", {style:{display:"flex", alignItems:"center", justifyContent:"space-between", gap:10}},
            h("div", {style:{minWidth:0}},
              h("div", {style:{fontWeight: ex.main?700:500, fontSize:13, color:INK}}, ex.name),
              h("div", {style:{fontSize:11, color:MUTED, marginTop:2}},
                cell.value ? ("Atual: " + cell.value + " kg") : "Sem registro"
              )
            ),
            h(Sparkline, {history:cell.history, color:currentDay.color})
          )
        );
      })
    );
  } else {
    list = h("div", {style:{display:"flex", flexDirection:"column", gap:10}},
      currentDay.exercises.map(function(ex){
        var cell = (data[currentDay.key]||{})[ex.id] || {value:"", history:[]};
        var historyKey = currentDay.key + "-" + ex.id;
        var isOpen = openHistory === historyKey;
        var hasHistory = (cell.history && cell.history.length>0) || cell.updatedAt;
        return h("div", {key:ex.id, style:{background:"#fff", borderRadius:10, border:"1px solid " + LINE, overflow:"hidden"}},
          h("div", {style:{display:"flex", alignItems:"center", padding:"12px 12px"}},
            h("div", {style:{flex:1, minWidth:0}},
              editMode
                ? h("div", {style:{display:"flex", flexDirection:"column", gap:6}},
                    h("div", {style:{display:"flex", alignItems:"center", gap:8}},
                      h("button", {
                          onClick: function(){ toggleMainExercise(currentDay.key, ex.id, ex.main); },
                          "aria-label": ex.main ? "Remover como principal" : "Marcar como principal",
                          style:{background:"none", border:"none", cursor:"pointer", fontSize:16,
                            color: ex.main ? "#E8A020" : "#C9CBD6", padding:0, lineHeight:1, flexShrink:0}
                        }, ex.main ? "★" : "☆"),
                      h("input", {
                        type:"text", value: ex.name,
                        "aria-label": "Nome do exercício",
                        onChange: function(e){ renameExercise(currentDay.key, ex.id, e.target.value); },
                        style:{flex:1, minWidth:0, fontSize:13.5, fontWeight:500, color:INK,
                          border:"1px solid " + LINE, borderRadius:6, padding:"6px 8px"}
                      }),
                      h("button", {
                          onClick: function(){ deleteExercise(currentDay.key, ex.id); },
                          "aria-label": "Excluir exercício",
                          style:{background:"none", border:"none", cursor:"pointer", fontSize:14, color:"#D64545", padding:"0 2px", flexShrink:0}
                        }, "✕")
                    ),
                    h("input", {
                      type:"text", value: ex.reps,
                      "aria-label": "Séries e repetições",
                      placeholder: "ex.: 4x8-10",
                      onChange: function(e){ updateExerciseReps(currentDay.key, ex.id, e.target.value); },
                      style:{width:110, fontSize:11.5, color:MUTED,
                        border:"1px solid " + LINE, borderRadius:6, padding:"5px 7px", marginLeft:24}
                    })
                  )
                : h("div", {style:{fontWeight: ex.main?700:500, fontSize:13.5, color:INK, display:"flex", alignItems:"center", gap:6}},
                    ex.main && h("span", {style:{color:"#E8A020", fontSize:12}}, "★"),
                    h("span", null, ex.name)
                  ),
              !editMode && h("div", {style:{fontSize:11.5, color:MUTED, marginTop:2}}, ex.reps)
            ),
            !editMode && h("div", {style:{display:"flex", alignItems:"center", gap:6}},
              h("input", {
                type:"number", inputMode:"decimal", step:"0.5", min:"0", placeholder:"—",
                value: cell.value || "",
                "aria-label": "Carga em quilos para " + ex.name,
                onChange: function(e){ handleChange(currentDay.key, ex.id, e.target.value); },
                onBlur: function(){ commitEntry(currentDay.key, ex.id); },
                style:{width:58, textAlign:"center", fontSize:15, fontWeight:700, color:INK,
                  border:"1.5px solid " + (cell.value?currentDay.color:LINE), borderRadius:7, padding:"7px 4px",
                  fontVariantNumeric:"tabular-nums"}
              }),
              h("span", {style:{fontSize:11, color:MUTED, fontWeight:600, width:16}}, "kg")
            )
          ),
          (hasHistory && !editMode) ? h("button", {
              onClick: function(){ setOpenHistory(isOpen ? null : historyKey); },
              "aria-label": isOpen ? "Fechar histórico" : "Ver histórico",
              style:{width:"100%", background: isOpen?"#FAFAFB":"transparent", border:"none",
                borderTop:"1px solid " + LINE, padding:"6px 12px", display:"flex", alignItems:"center",
                justifyContent:"space-between", cursor:"pointer"}
            },
            h("span", {style:{display:"flex", alignItems:"center", gap:5, fontSize:10.5, color:MUTED}},
              "🕐 " + (cell.updatedAt ? ("Atualizado em " + cell.updatedAt) : "Ver histórico")
            ),
            h("span", {style:{color:MUTED, transform: isOpen?"rotate(90deg)":"none", transition:"transform .15s", display:"inline-block"}}, "›")
          ) : null,
          (isOpen && cell.history && cell.history.length>0) ? h("div", {style:{padding:"8px 12px 12px", background:"#FAFAFB"}},
            h("div", {style:{display:"flex", flexDirection:"column", gap:4}},
              cell.history.map(function(hst, i){
                return h("div", {key:i, style:{display:"flex", justifyContent:"space-between", fontSize:11.5, color:"#4A4C55",
                    padding:"3px 0", borderBottom: i!==cell.history.length-1 ? ("1px dashed " + LINE) : "none"}},
                  h("span", null, hst.date),
                  h("span", {style:{fontWeight:700, color:INK}}, hst.value + " kg")
                );
              })
            )
          ) : null
        );
      }).concat(
        editMode ? [
          h("button", {
              key:"add-exercise",
              onClick: function(){ addExercise(currentDay.key); },
              style:{background:"#fff", border:"1.5px dashed " + LINE, borderRadius:10, color:MUTED,
                fontSize:12.5, fontWeight:600, padding:"12px", cursor:"pointer"}
            }, "+ Adicionar exercício")
        ] : []
      )
    );
  }

  var footerNote = h("div", {style:{marginTop:14, display:"flex", gap:8, alignItems:"flex-start", color:MUTED, fontSize:11, lineHeight:1.5, padding:"0 4px"}},
    h("span", null, "ℹ️"),
    h("span", null, "★ marca os exercícios principais. Os pesos são salvos automaticamente neste aparelho enquanto você digita.")
  );

  var saveIndicator = h("div", {style:{position:"fixed", bottom:"calc(16px + env(safe-area-inset-bottom))", left:"50%",
      transform: "translateX(-50%) translateY(" + (saveState==="idle"?20:0) + "px)",
      opacity: saveState==="idle"?0:1, transition:"all .25s ease",
      background:INK, color:"#fff", padding:"8px 14px", borderRadius:20, fontSize:11.5, fontWeight:600,
      display:"flex", alignItems:"center", gap:6, boxShadow:"0 4px 14px rgba(0,0,0,.25)", pointerEvents:"none"}},
    saveState==="saving"
      ? h(React.Fragment, null, h("span", {style:{width:7,height:7,borderRadius:"50%",background:currentDay.color,animation:"pulse 1s infinite"}}), "Salvando…")
      : h(React.Fragment, null, h("span", {style:{color:currentDay.color}}, "✓"), "Salvo neste aparelho")
  );

  var confirmModal = pendingConfirm ? h("div", {
      style:{position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", display:"flex",
        alignItems:"center", justifyContent:"center", padding:24, zIndex:20}
    },
    h("div", {style:{background:"#fff", borderRadius:14, padding:"20px 18px", maxWidth:320, width:"100%",
        boxShadow:"0 10px 30px rgba(0,0,0,.25)"}},
      h("div", {style:{fontSize:14, color:INK, lineHeight:1.5, marginBottom:18}}, pendingConfirm.message),
      h("div", {style:{display:"flex", gap:8}},
        h("button", {
            onClick: function(){ setPendingConfirm(null); },
            style:{flex:1, background:"#F4F4F6", border:"none", borderRadius:8, color:"#4A4C55",
              fontSize:12.5, fontWeight:700, padding:"10px 6px", cursor:"pointer"}
          }, "Cancelar"),
        h("button", {
            onClick: function(){ var action = pendingConfirm.onConfirm; setPendingConfirm(null); if (action) action(); },
            style:{flex:1, background: pendingConfirm.danger ? "#D64545" : INK, border:"none", borderRadius:8, color:"#fff",
              fontSize:12.5, fontWeight:700, padding:"10px 6px", cursor:"pointer"}
          }, "Confirmar")
      )
    )
  ) : null;

  var toast = toastMsg ? h("div", {style:{position:"fixed", top:"calc(16px + env(safe-area-inset-top))", left:"50%",
      transform:"translateX(-50%)", background:INK, color:"#fff", padding:"9px 16px", borderRadius:20,
      fontSize:12, fontWeight:600, boxShadow:"0 4px 14px rgba(0,0,0,.25)", zIndex:21, maxWidth:"85%", textAlign:"center"}
    }, toastMsg) : null;

  return h("div", {style:{background:PAPER, minHeight:"100vh"}},
    daysRow,
    banner,
    toolbar,
    h("div", {style:{padding:"16px 14px 100px"}}, list, footerNote),
    saveIndicator,
    confirmModal,
    toast
  );
}

var toolbarBtnStyle = {
  flex:1, background:"#fff", border:"1px solid " + LINE, borderRadius:8, color:"#4A4C55",
  fontSize:11, fontWeight:600, padding:"8px 6px", cursor:"pointer"
};

ReactDOM.createRoot(document.getElementById("root")).render(h(CargaTracker));
</script>
</body>
</html>
